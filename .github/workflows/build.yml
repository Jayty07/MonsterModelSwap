name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Download Dalamud
        run: |
          curl -sSL -o /tmp/dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          mkdir -p "$HOME/dalamud" && unzip -oq /tmp/dalamud.zip -d "$HOME/dalamud"
      - name: Build
        run: dotnet build MonsterModelSwap/MonsterModelSwap.csproj -c Release -p:DalamudLibPath="$HOME/dalamud/"
      - uses: actions/upload-artifact@v4
        with:
          name: MonsterModelSwap
          path: MonsterModelSwap/bin/Release/
